<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ORIONAI — Ask the sky anything</title>
<meta name="description" content="ORIONAI is an AI chat experience built by Rashmith." />
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="sky"></canvas>
<div class="aurora" aria-hidden="true">
  <span class="blob blob-a"></span>
  <span class="blob blob-b"></span>
  <span class="blob blob-c"></span>
</div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <span class="brand-name">ORION<span class="brand-ai">AI</span></span>
    </div>
    <button id="new-chat-btn" class="new-chat-btn" type="button" title="Start a new chat">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>New chat</span>
    </button>
  </header>

  <main class="chat-scroll" id="chat-scroll">

    <div class="empty-state" id="empty-state">
      <p class="eyebrow">✦ ORIONAI</p>
      <h1 class="empty-title">Ask the sky <span class="glow-word">anything.</span></h1>
      <p class="empty-sub">Type, talk, or show Orion a picture — one clear answer at a time.</p>
      <div class="empty-suggestions">
        <button class="chip" data-q="Explain quantum computing like I'm in college">Explain quantum computing</button>
        <button class="chip" data-q="Give me a 7-day study plan for data structures">Study plan for DSA</button>
        <button class="chip" data-q="What's the difference between REST and GraphQL?">REST vs GraphQL</button>
        <button class="chip" data-q="Write a short poem about the night sky">A poem about the sky</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

  </main>

  <div class="composer-wrap">

    <div class="image-preview" id="image-preview" hidden>
      <img id="image-preview-img" alt="Attached image preview" />
      <button type="button" id="image-remove-btn" class="image-remove-btn" aria-label="Remove image">✕</button>
    </div>

    <form id="composer-form" class="composer" autocomplete="off">
      <button type="button" id="attach-btn" class="icon-btn" title="Attach an image" aria-label="Attach an image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 16l5-5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 15v6M14 18h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <input id="image-input" type="file" accept="image/*" hidden />

      <input
        id="composer-input"
        type="text"
        placeholder="Ask Orion about anything under the sun..."
        aria-label="Ask ORIONAI a question"
      />

      <button type="button" id="mic-btn" class="icon-btn" title="Speak your question" aria-label="Speak your question">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="mic-ring"></span>
      </button>

      <button type="submit" class="composer-submit" aria-label="Send">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
    <p class="composer-hint">ORION can make mistakes. Built by <strong>Rashmith</strong>.</p>
  </div>

</div>

<script src="js/main.js"></script>
</body>
</html>
